########################################################################
# Vrui configuration file for the defunct KeckCAVES 4-sided CAVE,
# remaining as a template for similar setups.
# The CAVE used to be run by a cluster of six PCs, one head node with a
# console window, four render nodes, one for each of the CAVE's four
# screens, and an audio node connected to the CAVE's surround sound
# system. The tracking system used to be an InterSense IS-900 with one
# head tracker and two wands.
# Copyright (c) 2002-2026 Oliver Kreylos
